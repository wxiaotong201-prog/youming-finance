<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友明财经</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
padding:20px;
background:#111827;
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
color:#10b981;
}

.hero{
padding:60px 20px;
text-align:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
color:#cbd5e1;
font-size:18px;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.section-title{
font-size:28px;
margin-bottom:20px;
border-left:5px solid #10b981;
padding-left:10px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:10px;
color:#10b981;
}

.market{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-top:20px;
}

.market-item{
background:#111827;
padding:20px;
border-radius:12px;
text-align:center;
}

.market-item span{
display:block;
margin-top:10px;
font-size:24px;
font-weight:bold;
color:#10b981;
}

footer{
padding:40px;
text-align:center;
background:#111827;
margin-top:50px;
color:#94a3b8;
}
</style>
</head>

<body>

<header>
<div class="logo">友明财经</div>
</header>

<section class="hero">
<h1>全球财经市场深度观察</h1>
<p>聚焦A股、美股、黄金、白银、AI产业与宏观经济</p>
</section>

<div class="container">

<h2 class="section-title">市场概览</h2>

<div class="market">
<div class="market-item">
沪深300
<span>+1.25%</span>
</div>

<div class="market-item">
纳斯达克
<span>+0.82%</span>
</div>

<div class="market-item">
黄金
<span>3365</span>
</div>

<div class="market-item">
白银
<span>38.42</span>
</div>
</div>

<br><br>

<h2 class="section-title">最新分析</h2>

<div class="cards">

<div class="card">
<h3>沪银主连走势分析</h3>
<p>技术面突破关键压力位，关注夜盘资金流向。</p>
</div>

<div class="card">
<h3>美联储政策观察</h3>
<p>市场正在等待下一次议息会议结果。</p>
</div>

<div class="card">
<h3>AI产业投资机会</h3>
<p>算力、芯片与机器人赛道持续受到关注。</p>
</div>

</div>

</div>

<footer>
© 2026 友明财经 | Finance & Investment Research
</footer>

</body>
</html>
